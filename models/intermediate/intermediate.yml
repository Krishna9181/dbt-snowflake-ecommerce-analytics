version: 2

models:
  - name: int_order_items
    description: Enriched order line items joined with order headers and product details. Adds days_to_ship calculation.
    config:
      tags: ['order']
    columns:
      - name: order_id
        description: Foreign key to the parent order.
        tests: [not_null]
      - name: line_number
        description: Line number within the order.
        tests: [not_null]
      - name: supplier_id
        description: Foreign key to the supplier fulfilling this line item.
        tests:
          - not_null
          - relationships:
              to: ref('stg_suppliers')
              field: supplier_id
      - name: part_id
        description: Foreign key to the product ordered.
        tests:
          - not_null
          - relationships:
              to: ref('stg_parts')
              field: part_id
      - name: days_to_ship
        description: Number of days between order date and ship date.
  - name: int_customer_enriched
    description: Customer data enriched with geographic information (nation and region) via joins.
    config:
      tags: ['customer']
    columns:
      - name: customer_id
        description: Unique identifier for the customer.
        tests:
          - unique
          - not_null
          - relationships:
              to: ref('stg_customers')
              field: customer_id
      - name: nation_name
        description: Country where the customer is located.
        tests:
          - not_null
          - relationships:
              to: ref('stg_nations')
              field: nation_name
      - name: region_name
        description: Geographic region of the customer.
        tests:
          - not_null
          - relationships:
              to: ref('stg_regions')
              field: region_name
